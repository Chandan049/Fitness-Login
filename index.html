<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Body Recomp · Private access</title><style>
body{font:17px system-ui;background:#f1f5f3;color:#17352b;margin:0;padding:32px}main{max-width:470px;margin:8vh auto;background:white;padding:32px;border-radius:16px;box-shadow:0 8px 40px #18342712}h1{font-size:27px}label{display:block;margin:16px 0}input{display:block;box-sizing:border-box;width:100%;padding:12px;margin-top:8px;border:1px solid #b6c6bd;border-radius:7px;font:inherit}button{padding:12px 20px;border:0;border-radius:7px;background:#176b4c;color:white;font:inherit;cursor:pointer;margin:12px 8px 0 0}button.secondary{background:#e7eee9;color:#17352b}pre{white-space:pre-wrap;font:inherit;font-size:14px}#message{min-height:26px;color:#7a3815}footer{font-size:13px;color:#56665e;margin-top:24px}</style></head><body><main><h1>Connect your private dashboard</h1><p>Sign in to approve access to your food, activity, sleep, and body measurements.</p><form id="login"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button>Sign in</button></form><section id="consent" hidden><p>The following app is requesting read and write access to your dashboard.</p><pre id="details"></pre><button id="approve">Approve access</button><button id="deny" class="secondary">Deny</button></section><p id="message" role="status" aria-live="polite"></p><footer>Only your configured private account can access the backend. This page contains no health records.</footer></main><script type="module" src="./app.js"></script></body></html>
